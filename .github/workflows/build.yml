name: Build & Release Fast Compose Preview

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The IDE compiled against: the oldest supported version (pluginSinceBuild 261), downloaded by Gradle.
  PLATFORM_VERSION: "2026.1"

jobs:
  # ---- Build and compatibility check, for pull requests and release tags ----
  check:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The IDEs for the compatibility check take several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # gradlew is not executable in git, since it was added on Windows.
      - run: chmod +x gradlew

      - name: Build the plugin
        run: ./gradlew buildPlugin -PplatformVersion=$PLATFORM_VERSION --stacktrace

      # Checks the plugin against the IDE versions JetBrains recommends for its since/until range.
      - name: Check compatibility
        run: ./gradlew verifyPlugin -PplatformVersion=$PLATFORM_VERSION -PverifyIdes=recommended --stacktrace

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports/
          retention-days: 7

  # ---- Release: JetBrains Marketplace and GitHub release, for tags like v0.1.0 ----
  release:
    name: Release and publish
    runs-on: ubuntu-latest
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match the plugin version, so v0.1.0 publishes 0.1.0.
      - name: Check tag matches version
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d'=' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pluginVersion $version"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # gradlew is not executable in git, since it was added on Windows.
      - run: chmod +x gradlew

      # Signs the plugin and uploads it; a pre-release version such as 0.2.0-beta.1 goes to its channel (beta).
      - name: Publish to the JetBrains Marketplace
        run: ./gradlew publishPlugin -PplatformVersion=$PLATFORM_VERSION --stacktrace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      # Titled with the bare version, so v0.1.0 is released as 0.1.0.
      - name: Name the release
        run: echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # Created after publishing, so a release only exists for versions on the Marketplace.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          files: build/distributions/*-signed.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-reports
          path: build/reports/
          retention-days: 7
